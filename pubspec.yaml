name: taxi_app
description: "Aplicación móvil para servicio de transporte con geolocalización en tiempo real."
publish_to: 'none'
version: 1.0.5+36

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.1.4
  firebase_app_check: ^0.4.1+5
  google_sign_in: ^6.2.1
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  provider: ^6.1.5
  google_maps_flutter: ^2.10.0
  geolocator: ^14.0.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  geocoding: ^4.0.0
  flutter_local_notifications: ^19.1.0
  firebase_messaging: ^16.1.3
  url_launcher: ^6.3.1
  http: ^1.6.0
  flutter_screenutil: ^5.9.3
  image_picker: ^1.2.1
  image_cropper: ^12.1.1
  firebase_storage: ^13.0.5
  flutter_image_compress: ^2.4.0
  path_provider: ^2.0.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  firebase_crashlytics: ^5.0.7
  firebase_remote_config: ^6.1.0
  awesome_snackbar_content: ^0.1.8
  animated_snack_bar: ^0.4.0
  flutter_background_service: ^5.1.0
  connectivity_plus: ^7.0.0
  sign_in_with_apple: ^7.0.1
  package_info_plus: ^8.3.1
  new_version_plus: ^0.1.0
    

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  firebase_core_platform_interface: ^6.0.2
  # Herramienta CLI usada solo para regenerar el splash nativo
  # (dart run flutter_native_splash:create). No se importa en tiempo de ejecución.
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/Ride_icon_white_bg.png"
  remove_alpha_ios: true
  adaptive_icon_foreground: "assets/img/Ride_foreground.png"
  adaptive_icon_background: "#FFFFFF"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/img/Ride_foreground.png
  image_dark: assets/img/Ride_foreground.png
  android: true
  ios: true
  web: false
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: assets/img/Ride_foreground.png
    icon_background_color: "#FFFFFF"
