name: taxi_app
description: "Aplicación móvil de servicio de taxi con geolocalización en tiempo real."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.1.4
  google_sign_in: ^6.2.1
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  provider: ^6.1.5
  lottie: ^3.3.2
  google_maps_flutter: ^2.10.0
  geolocator: ^14.0.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  geocoding: ^4.0.0
  flutter_local_notifications: ^19.1.0
  url_launcher: ^6.3.1
  http: ^1.6.0
  flutter_screenutil: ^5.9.3
  image_picker: ^1.2.1
  firebase_storage: ^13.0.5
  flutter_image_compress: ^2.4.0
  path_provider: ^2.0.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_facebook_auth: ^7.1.5
  firebase_crashlytics: ^5.0.7
  firebase_analytics: ^12.1.2
  awesome_snackbar_content: ^0.1.8
  animated_snack_bar: ^0.4.0
    

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/img/
    - assets/gif/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/img/icono.png"
  adaptive_icon_foreground: "assets/img/foreground_car.png"
  adaptive_icon_background: "assets/img/background_car.png"
